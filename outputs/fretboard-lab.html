<style>
/* Independent Studio Green skin. Music, transport and audio use the copied engine. */
:root {
  color-scheme: dark;
  --bg: #1b1c1c;
  --panel: #272828;
  --panel2: #2e3030;
  --line: #424545;
  --muted: #a8abaa;
  --text: #edefee;
  --accent: #35ce68;
  --accent2: #85dfa1;
  --root: #65b8ed;
  --root-soft: #b1dcf7;
  --studio-inset: #1d1f1e;
  --studio-edge: inset 0 1px 0 #ffffff08, 0 2px 5px #0002;
}
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: #35ce6850; color: #fff; }
button, input, select, summary { -webkit-tap-highlight-color: transparent; }
button, input, select { accent-color: var(--accent); }
button, select, input[type=number] { font-variant-numeric: tabular-nums; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible,
.switch:focus-visible, .platform-brand:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}
.app { grid-template-columns: 206px minmax(0, 1fr); }
.sidebar { background: #222423; padding: 24px 14px; gap: 30px; border-color: #393d3a; }
.platform-brand { gap: 9px; }
.platform-name { font-size: 16px; white-space: nowrap; }
.platform-brand:after { width: 22px; background: #2e302f; box-shadow: var(--studio-edge); }
.mark, .platform-brand .mark {
  border-radius: 6px; background: linear-gradient(155deg, #58de82, #27b759);
  color: #102517; border: 1px solid #62dd8a;
  box-shadow: inset 0 1px 1px #d6ffe34a, 0 2px 4px #0004;
}
.guitar-logo { width: 21px; height: 21px; display: block; color: #102719; fill: currentColor; }
.title-lockup > .mark .guitar-logo { width: 22px; height: 22px; }
.tool-nav { gap: 8px; }
.studio-nav-icon {
  display: none; width: 23px; height: 23px; flex-shrink: 0;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.sidebar-collapsed .tool-nav button[id]::before { content: none; }
.sidebar-collapsed .tool-nav button {
  display: flex; align-items: center; justify-content: center;
  width: 48px; min-height: 46px; padding: 10px 4px;
}
.sidebar-collapsed .tool-nav button::after {
  content: attr(data-short-label); display:block;
  font-size:13px; font-weight:600; white-space:nowrap;
}
.sidebar-collapsed .studio-nav-icon { display: none!important; }
.tool-nav button { min-height: 46px; border-radius: 5px; font-size: 13px; }
.tool-nav button:hover { background: #2f3230; border-color: #4b554d; }
.tool-nav button.active {
  background: linear-gradient(110deg, #303b34, #2d332f);
  border-color: #426c4d; color: #c7f6d5; box-shadow: inset 3px 0 var(--accent);
}
.menu-label { color: #858d88; font-size: 10px; letter-spacing: .17em; padding-left: 12px; margin-bottom: 14px; }
.app > main { padding: 26px 30px 42px; max-width: 1550px; }
.topbar { align-items: center; margin-bottom: 24px; padding-bottom: 22px; border-bottom: 1px solid #393d3a; }
.topbar h1 { font-size: 27px; font-weight: 600; letter-spacing: .02em; }
.title-lockup { gap: 13px; }
.title-lockup > .mark { width: 34px; height: 34px; }
.status.credit { background: #282d29; color: #b0c6b6; border-color: #454d47; border-radius: 4px; font-size: 11px; }
.status.credit:before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px #35ce6840; }
.controls, .card, .groove-settings, .result-card, .audio-options, .speed-ladder, .motif-modal, .cs-intro {
  border-radius: 7px; border-color: var(--line); background: var(--panel); box-shadow: var(--studio-edge);
}
.controls { padding: 16px; gap: 12px; margin-bottom: 18px; }
.field label, .ladder-grid label, .slider-label { color: #b0b5b1; }
.field select, .field input[type=number], .groove-layout select, .groove-layout input[type=number],
.ladder-grid input, .ik-controls select, .cs-intro select {
  min-height: 42px; border-radius: 4px; border: 1px solid #474c49;
  background: linear-gradient(#1e201f, #242625); color: var(--text);
  box-shadow: inset 0 1px 3px #0004; padding: 9px 10px;
}
select:hover, input[type=number]:hover { border-color: #637167; }
/* Native popup menus need solid option colors; the closed field's gradient
   does not supply a background to the browser's separate option surface. */
select { color-scheme: dark; }
select option, select optgroup {
  background-color: #242625;
  color: #edefee;
}
select option:checked {
  background-color: #30543c;
  color: #f4fff7;
}
select option:disabled, select optgroup:disabled {
  color: #959d98;
}
.btn, .rhythm-chip, .segmented button, .result-bar header button, .modal-close, .stroke {
  border: 1px solid #4e5350; border-radius: 5px; color: #cdd1ce;
  background: linear-gradient(180deg, #3a3d3b, #2d302e);
  box-shadow: inset 0 1px 0 #ffffff0c, 0 2px 2px #0002;
  transition: background .12s, border-color .12s, box-shadow .12s;
}
.btn:hover, .rhythm-chip:hover, .segmented button:hover { border-color: #758279; background: #3e4440; color: #f0f5f1; }
.btn:active, .rhythm-chip:active { box-shadow: inset 0 2px 4px #0005; }
.btn.primary, .motif-actions .btn.primary, .segmented .active, .ik-view-toggle button.active {
  background: linear-gradient(180deg, #48d677, #2bbb5c); border-color: #65dd8c; color: #102719;
  box-shadow: inset 0 1px 0 #d8ffe53b, 0 2px 3px #0003; font-weight: 700;
}
.btn.primary:hover { background: linear-gradient(#65e58e, #38cc6a); border-color: #a0efb9; }
.rhythm-chip.active, .transport .active, .audio-options > .btn.active {
  background: #303b33; border-color: #4b865d; color: #a4e9ba;
  box-shadow: inset 0 1px 2px #0003;
}
.rhythm-chip.active:before { content: ''; display: inline-block; width: 5px; height: 5px; margin-right: 6px; background: var(--accent); border-radius: 50%; vertical-align: middle; }
.card-head, .result-card > header, .settings-header { background: linear-gradient(#303331, #2b2d2c); border-color: var(--line); }
.card-head h2, .result-card h2 { font-weight: 600; }
.badge { border-color: #4e5550; color: #b0bcb3; border-radius: 3px; }
.small, .range-labels { color: var(--muted); }

/* Quiet graphite fingerboard: every fret boundary has the same treatment. */
.fret-wrap { padding: 22px 20px; background: #212422; }
.strings { background: linear-gradient(180deg, #383d39, #303431); border-color: #768478; }
.string { border-color: #272d28; }
.string:before { background: linear-gradient(#b0b8b1, #6e7b71); box-shadow: 0 1px 1px #0008; }
.fret, .fret:nth-child(4) { border-right: 2px solid #748077; background: transparent; box-shadow: none; }
.fret:first-child { border-left-color: #8f9b91; }
.fret:nth-child(3)::after,.fret:nth-child(5)::after,.fret:nth-child(7)::after,.fret:nth-child(9)::after,
.fret:nth-child(12)::before,.fret:nth-child(12)::after { background: #a0aca1; border-color: #b0bab0; box-shadow: none; opacity: .6; }
.nut { background: #bbc4bb; }
.note.scale { color: #c1ddc8; background: #344e3d; border-color: #60816a; }
.note.chord { color: #13291b; background: var(--accent2); border-color: #b0efc3; border-radius: 5px; }
.note.root, .note.chord.root { color: #082037; background: var(--root); border-color: var(--root-soft); }
.note.open-muted { color: #8b968e; background: #2b2e2c; border-color: #49504b; }
.chords { gap: 12px; padding: 14px; }
.chords .chord { background: #2d302e; border-color: #4e5650; border-radius: 5px; padding: 16px; gap: 11px; box-shadow: inset 0 1px #ffffff06; }
.chords .chord:hover { background: #343b36; border-color: #72917b; }
.chords .chord.selected { background: linear-gradient(135deg, #344039, #2e3731); border-color: #59b274; box-shadow: inset 3px 0 var(--accent); }
.chord-note-row span { font-size: 20px; }
.chord-degree-row span { font-size: 18px; }
.chord-interval-row span { font-size: 12px; }
.chords .chord .name { font-size: 16px; }
.chords .chord .roman { color: #a4d6b2; }
.legend .s { background: #60816a; }
.switch { background: #171c18; border: 1px solid #536058; box-shadow: inset 0 1px 3px #0006; }
.switch i { width: 14px; height: 14px; background: linear-gradient(#e5eae6,#919d94); box-shadow: 0 1px 3px #0009; }
.switch.on { background: #28603b; border-color: #59a770; }
.switch.on i { background: #95e6af; }

/* Native input ranges keep touch/keyboard semantics; only the rail and cap change. */
input[type=range] {
  --studio-fill: 50%; -webkit-appearance: none; appearance: none; border: 0;
  height: 38px; min-height: 38px; margin: 3px 0; padding: 0 1px; cursor: ew-resize;
  background: repeating-linear-gradient(90deg, #69776c 0 1px, transparent 1px 10%) left 3px / 100% 5px no-repeat,
              repeating-linear-gradient(90deg, #69776c 0 1px, transparent 1px 10%) left 30px / 100% 5px no-repeat;
  touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 7px; border-radius: 3px; border: 1px solid #111812;
  background: linear-gradient(90deg, #389c58 var(--studio-fill), #121713 var(--studio-fill));
  box-shadow: 0 1px 0 #ffffff12, inset 0 1px 2px #0008;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 27px; margin-top: -11px; border-radius: 3px;
  border: 1px solid #9ea89f;
  background: linear-gradient(180deg, #9ea89f 0, #737e76 42%, #d7e0d9 43% 49%, #343d36 50% 56%, #68736b 57%, #88968c 100%);
  box-shadow: 0 2px 4px #0009, inset 0 1px #e1e9e373;
}
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #121713; border: 1px solid #111812; }
input[type=range]::-moz-range-progress { height: 6px; background: #389c58; }
input[type=range]::-moz-range-thumb { width: 18px; height: 25px; border-radius: 3px; border: 1px solid #9ea89f; background: linear-gradient(#9ea89f,#647269 45%,#d7e0d9 46% 53%,#647269 54%,#88968c); box-shadow: 0 2px 4px #0009; }
input[type=range]:disabled { opacity: .45; cursor: default; }
.range-row span:last-child, .slider-label output, .motif-volume output, .studio-volume-value {
  color: #a0e3b3; font: 500 13px 'DM Mono', monospace; font-variant-numeric: tabular-nums;
  padding: 4px 7px; background: #202622; border: 1px solid #48534b; border-radius: 3px;
}
.range-row { align-items: center; margin-bottom: 3px; }
.slider-label { align-items: center; }
.mixer label:has(.studio-volume-value) { grid-template-columns: 1fr auto; align-items: center; }
.mixer label > input { grid-column: 1 / -1; }

.settings-header { padding: 12px 16px; }
.groove-title { font-size: 17px; letter-spacing: .03em; }
.groove-title:before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; vertical-align: middle; margin-right: 10px; box-shadow: 0 0 6px #35ce6825; }
.settings-columns { align-items: stretch; grid-template-columns: 1fr 1fr 1.1fr; }
.settings-columns > div + div { border-left: 1px solid var(--line); }
.settings-columns section, .groove-settings > section { padding: 16px; }
.groove-settings h3 { font: 600 12px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; letter-spacing: .035em; color: #b4c2b8; }
.settings-columns .control-grid { gap: 12px; }
.settings-materials { background: #282c29; }
.settings-columns .harmony-edit { grid-template-columns: repeat(2,minmax(0,1fr)); }
.harmony-edit > div { background: var(--studio-inset); border-color: #4c534e; border-radius: 4px; }
.harmony-edit > div select { padding: 6px; border: 0; background: transparent; box-shadow: none; }
.segmented { gap: 4px; }
.sequence-section { background: #242925; }
.sequence-section.sequence-on { box-shadow: inset 3px 0 var(--accent); background: #2e3831; }
.sequence-dock { background: transparent; padding: 16px 0 0; margin-top: 14px; }
.switch-row input { border-color: #536058; background: #1c211d; box-shadow: inset 0 2px 4px #0004; }
.switch-row input::after { background: linear-gradient(#e0e6e1,#929e95); box-shadow: 0 1px 2px #0008; }
.switch-row input:checked { background: #287042; border-color: #4ca367; }
.switch-row input:checked::after { background: #b8f2ca; }
.speed-ladder, .audio-options { padding: 14px 16px; margin: 0 0 16px; }
.speed-ladder summary, .audio-options summary { color: #c4d0c7; font-size: 14px; min-height: 34px; }
.audio-options > summary {
  display: flex; align-items: center; gap: 8px;
  min-height: 34px; line-height: 20px; margin: 0; padding: 0;
  list-style: none;
}
.audio-options > summary::-webkit-details-marker { display: none; }
.audio-options > summary::before {
  content: ''; flex: 0 0 6px; width: 6px; height: 6px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); margin-right: 2px;
}
.audio-options[open] > summary { margin-bottom: 12px; }
.audio-options[open] > summary::before { transform: rotate(45deg); }
.audio-options > .mixer:last-child { margin-bottom: 0; }

.connection-bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.connection-bar{min-width:0;border:1px solid var(--line);border-radius:5px;background:#232525;overflow:hidden}.connection-bar header{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}.connection-bar header strong{font:600 17px 'DM Mono',monospace}.connection-bar header span{font-size:12px;color:var(--muted)}.connection-bar.current{border-color:var(--root);box-shadow:inset 0 0 0 1px var(--root)}
.training-tab{width:100%;overflow-x:auto;overscroll-behavior-x:contain;padding:8px}.training-tab svg{display:block;width:100%;min-width:350px}.ts-beats text,.ts-string,.ts-caption{fill:var(--muted);font:12px ui-monospace,monospace}.ts-beats path{stroke:#434747;stroke-width:.7;stroke-dasharray:2 5}.ts-wire{stroke:#737a77;stroke-width:1}.ts-note{cursor:pointer}.ts-note rect{fill:#2d3831;stroke:#689574;stroke-width:1.2}.ts-note text{fill:#c6f1d1;font:700 14px ui-monospace,monospace;pointer-events:none}.ts-note .ts-degree{font-size:11px;fill:#d2d8d4}.ts-note .ts-length{stroke:#85aa91;stroke-width:2;pointer-events:none}.ts-root rect{fill:#213644;stroke:#65b8ed}.ts-root text{fill:#9dd7fd}.ts-changed rect,.ts-target rect{stroke:var(--accent);stroke-width:2}.ts-note.sounding rect,.ts-note:focus rect{fill:#446950;stroke:#c5fbd3;stroke-width:2}.ts-note:focus{outline:none}.ts-caption{font-size:10px}
.connection-view{justify-content:flex-end}.connection-view label{display:flex;gap:8px}.connection-results{min-width:0}
.motif-mode-tabs{display:flex;gap:10px;margin-bottom:18px}.motif-mode-tabs .btn{flex:1;min-height:46px}.motif-mode-tabs .active{border-color:var(--accent);color:var(--accent)}
.motif-modal.developing{width:min(1060px,calc(100vw - 28px));border-radius:7px}.motif-modal .motif-head{position:sticky;top:0;background:var(--panel);z-index:3}.motif-modal.developing .motif-body{padding:14px 18px}.motif-modal.developing .motif-body> :not(.motif-mode-tabs):not(#motifDevelopment){display:none}.motif-modal.developing #motifDevelopment{display:block;margin:0;border:0}.motif-development-inline>.card-head{display:none}.motif-development-inline .training-body{padding:0}.motif-development-inline .training-fields{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0}.motif-development-inline [hidden]{display:none!important}.motif-guidance{padding:12px 14px;border-left:2px solid var(--accent);background:#232a26;color:var(--text);font-size:14px;line-height:1.8;margin:0 0 14px}.motif-development-inline .training-ab{grid-template-columns:1fr;margin:16px 0;gap:16px}.motif-development-inline .training-ab>div{border:1px solid var(--line);padding:12px;border-radius:5px}.motif-development-inline .training-ab h3{margin:0 0 5px}.motif-development-inline .training-score{display:block}.motif-development-inline .training-tab svg{min-width:600px}.motif-modal.developing .training-actions:has([data-motif-play]){position:sticky;bottom:-14px;z-index:2;background:var(--panel);padding:12px 0;border-top:1px solid var(--line);margin-bottom:0}.modal-backdrop.open{z-index:90}body:has(.modal-backdrop.open) #trainingTaskDock{display:none}

<body>
<div class="app"><aside class="sidebar"><div class="platform-brand"><div class="mark" aria-hidden="true"><svg class="guitar-logo" viewBox="0 0 40 40" focusable="false" aria-hidden="true"><path fill-rule="evenodd" d="M17 3h6v6h-1v6c4-2 7 1 6 4-.8 2-2 3 0 5 3 3 3 6 1 9-3 4-15 4-18 0-2-3-2-6 1-9 2-2 .8-3 0-5-1-3 2-6 6-4V9h-1V3Zm6 21a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path d="M17 31h6M20 10v10" fill="none" stroke="#45d577" stroke-width="1.3" stroke-linecap="round"/></svg></div><span class="platform-name">一起练琴吧</span></div><div><div class="menu-label">练习工具</div><nav class="tool-nav" aria-label="练习工具导航"><button class="active" id="navChord" type="button">和弦琶音练习</button><button id="navRhythm" type="button">吉他律动生成器</button></nav></div><div class="sidebar-note">把每天的练习拆成一个小节，先听，再弹，慢慢建立稳定律动。</div></aside><main><div class="topbar"><div class="title-area"><div class="title-lockup"><div class="mark" role="img" aria-label="吉他图标"><svg class="guitar-logo" viewBox="0 0 40 40" focusable="false" aria-hidden="true"><path fill-rule="evenodd" d="M17 3h6v6h-1v6c4-2 7 1 6 4-.8 2-2 3 0 5 3 3 3 6 1 9-3 4-15 4-18 0-2-3-2-6 1-9 2-2 .8-3 0-5-1-3 2-6 6-4V9h-1V3Zm6 21a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path d="M17 31h6M20 10v10" fill="none" stroke="#45d577" stroke-width="1.3" stroke-linecap="round"/></svg></div><div class="title-copy"><div class="title-line"><h1 id="pageTitle">和弦琶音练习工具</h1></div></div></div><p id="pageSubtitle">探索调内七和弦，在指板上锁定你的下一个把位。</p></div><div class="status credit" aria-label="作者注释">LIM 制作</div></div>
<section class="rhythm-panel" id="rhythmPanel"></section>
<section class="controls"><div class="field"><label>调式根音</label><select id="root"><option>C</option><option>C♯</option><option>D</option><option>E♭</option><option>E</option><option>F</option><option>F♯</option><option>G</option><option>A♭</option><option>A</option><option>B♭</option><option>B</option></select></div><div class="field"><label>调式</label><select id="mode"><option value="major">Ionian · 大调</option><option value="dorian">Dorian · 多利亚</option><option value="mixolydian">Mixolydian · 混合利底亚</option><option value="minor">Aeolian · 自然小调</option></select></div><div class="field"><label>显示</label><select id="display"><option value="scale">调式音阶</option><option value="chord">当前和弦</option></select></div><div class="field"><label>简谱标记</label><select id="notation"><option value="movable">首调 · 和弦 1–3–5–7</option><option value="fixed">固定调 · C=1</option></select></div><div class="spacer"></div><button class="btn" id="motifBtn" type="button" aria-haspopup="dialog" aria-controls="motifModal">♫ 生成动机训练</button><button class="btn" id="reset" type="button">重置</button><button class="btn primary" id="play" type="button">▶ 播放琶音</button></section>
<div class="grid"><section class="card"><div class="card-head"><h2 id="boardTitle">C Ionian · 0 — 12 品</h2><span class="small">E A D G B E</span></div><div class="fret-wrap"><div class="fretboard"><div class="frets" id="frets"></div><div class="open-label">0</div><div class="strings" id="strings"></div><div class="nut"></div><div class="open-notes" id="openNotes"></div><div class="notes" id="notes"></div></div></div><div class="legend"><span><b></b><span id="rootLegend">调式根音</span></span><span><b class="s"></b>调式音</span><span><b class="c"></b>和弦音</span><span class="small" style="margin-left:auto">0 品为空弦；点击和弦查看琶音指型</span></div></section>
<aside class="side"><section class="card"><div class="card-head"><h2>调内七和弦</h2><span class="small" id="chordCount">7 chords</span></div><div class="chords" id="chords"></div></section><section class="card position"><div class="card-head" style="padding:0 0 14px;border:0"><h2>把位范围</h2><span class="small" id="rangeText">0 — 12 品</span></div><div class="range-row"><span>起始品</span><span id="startVal">0</span></div><input id="start" type="range" min="0" max="12" value="0"><div class="range-row" style="margin-top:14px"><span>结束品</span><span id="endVal">12</span></div><input id="end" type="range" min="0" max="12" value="12"><div class="range-labels"><span>0</span><span>6</span><span>12</span></div><div class="toggle"><span>仅显示把位内音符</span><div class="switch on" id="switch"><i></i></div></div></section></aside></div></main></div>
<div class="modal-backdrop" id="motifModal" aria-hidden="true"><div class="motif-modal" role="dialog" aria-modal="true" aria-labelledby="motifTitle" tabindex="-1"><div class="motif-head"><div><h2 id="motifTitle">和弦动机训练</h2><p id="motifContext">只使用当前和弦内音</p></div><button class="modal-close" id="motifClose" type="button" aria-label="关闭动机训练">×</button></div><div class="motif-body"><p class="motif-section-label">Chord tones · 和弦内音</p><div class="motif-tones" id="motifTones"></div><p class="motif-section-label">Motif · 八拍简谱</p><div class="motif-sequence" id="motifSequence" aria-live="polite"></div><p class="motif-hint" id="motifHint">先用拍手或脚打出八拍，再唱简谱；熟悉后在当前把位寻找相同音级。</p><label class="motif-volume" for="practiceVolume"><span>播放音量（琶音 / 动机）</span><output id="practiceVolumeValue" for="practiceVolume">80%</output><input id="practiceVolume" type="range" min="0" max="100" value="80" step="1" aria-label="琶音和动机播放音量"></label><div class="motif-actions"><button class="btn" id="regenerateMotif" type="button">↻ 换一条动机</button><button class="btn primary" id="playMotif" type="button">▶ 播放动机</button></div></div></div></div>

function installPractice(){
 const settings=document.querySelector('.groove-settings'),sections=[...settings.querySelectorAll(':scope > section')],header=document.createElement('div');header.className='settings-header';header.append(document.querySelector('.groove-title'),$('ggGenerate'),$('ggCollapse'));settings.prepend(header);
 const sequenceControls=$('sequenceControls');sequenceControls.remove();
 const sequenceSection=document.createElement('section');sequenceSection.className='sequence-section';sequenceSection.innerHTML='<div class="sequence-section-head"><div><h3>模进练习 / SEQUENCE PRACTICE</h3><p>关闭时按普通律动生成；开启后按动机做调式或和声模进。</p></div><label class="switch-row"><input type="checkbox" id="ggSequenceOn"> 开启模进练习</label></div>';
 sequenceSection.append(sequenceControls);
 const columns=document.createElement('div');columns.className='settings-columns';[[sections[0],sections[2]],[sections[1]],[sections[3]]].forEach(group=>{const col=document.createElement('div');group.forEach(s=>col.append(s));columns.append(col)});settings.append(columns,sections[4],sequenceSection);sections[4].classList.add('settings-materials');sequenceControls.classList.add('sequence-dock');

 const transport=document.querySelector('.transport');transport.classList.add('practice-dock');
 $('ggTempoDisplay').insertAdjacentHTML('beforebegin','<button class="btn" id="ggSlower" aria-label="减慢 5 BPM">−5</button>');$('ggTempoDisplay').insertAdjacentHTML('afterend','<button class="btn" id="ggFaster" aria-label="加快 5 BPM">+5</button><button class="btn" id="ggFocus">专注练习</button><strong id="ggPhase" aria-live="polite">准备好后开始</strong>');
 const extra=document.createElement('div');extra.className='practice-options';extra.innerHTML='<label>预备拍 <select id="ggCount"><option value="0">无</option><option value="1">1 小节</option><option value="2">2 小节</option></select></label><label><input type="checkbox" id="ggAlternate">听一遍 / 弹一遍</label><label>循环起点 <select id="ggA"></select></label><label>终点 <select id="ggB"></select></label><button class="btn" id="ggAllBars">全段</button><button class="btn" id="ggUndo">撤销生成</button><button class="btn" id="ggFavorite">☆ 收藏练习</button><label>收藏 <select id="ggFavorites"><option value="">选择收藏</option></select></label><button class="btn" id="ggLoadFavorite">载入</button><button class="btn" id="ggDaily">今日练习</button><span class="daily-status" id="ggDailyStatus">日课未生成</span>';
 transport.before(extra);
 const ladder=document.createElement('details');ladder.className='speed-ladder';ladder.open=true;ladder.innerHTML='<summary>速度阶梯练习</summary><div class=\"ladder-grid\"><label>起始 BPM<input id=\"ggLadderStart\" type=\"number\" min=\"40\" max=\"220\" value=\"70\"></label><label>目标 BPM<input id=\"ggLadderTarget\" type=\"number\" min=\"40\" max=\"220\" value=\"120\"></label><label>每个速度增速<input id=\"ggLadderStep\" type=\"number\" min=\"1\" max=\"30\" value=\"5\"></label><label>每个速度循环<input id=\"ggLadderRepeats\" type=\"number\" min=\"1\" max=\"8\" value=\"2\"></label></div><div class=\"ladder-actions\"><button class=\"btn\" id=\"ggLadderStartBtn\">开始速度阶梯</button><button class=\"btn\" id=\"ggLadderStopBtn\">停止阶梯</button><span id=\"ggLadderStatus\">未启动</span></div>';extra.before(ladder);
 const secondary=document.createElement('details');secondary.className='audio-options';secondary.innerHTML='<summary>音轨与音色设置</summary>';extra.before(secondary);['ggGuitarToggle','ggDrumToggle','ggClickToggle','ggTest','ggReload','ggSoundStatus'].forEach(id=>secondary.append($(id)));secondary.append(document.querySelector('.output-meter'),document.querySelector('.mixer'));
 $('ggCount').value=practice.count;$('ggAlternate').checked=practice.alternate;
 $('ggDaily').onclick=dailyPractice;$('ggLadderStartBtn').onclick=startLadder;$('ggLadderStopBtn').onclick=stopLadder;
 $('ggCount').onchange=()=>{stop();practice.count=+$('ggCount').value};$('ggAlternate').onchange=()=>{stop();practice.alternate=$('ggAlternate').checked};
 $('ggSlower').onclick=()=>changeTempo(-5);$('ggFaster').onclick=()=>changeTempo(5);
 $('ggFocus').onclick=()=>{practice.focus=!practice.focus;applyFocus()};applyFocus();
 for(const id of ['ggA','ggB'])$(id).onchange=()=>{stop();practice.a=+$('ggA').value;practice.b=+$('ggB').value;if(practice.a>practice.b){if(id==='ggA')practice.b=practice.a;else practice.a=practice.b}state.loop=true;render()};
 $('ggAllBars').onclick=()=>{stop();practice.a=0;practice.b=null;render()};
 $('ggUndo').onclick=()=>{const item=practice.history.pop();if(item)loadPractice(item)};
 $('ggFavorite').onclick=()=>{if(!state.result)return;try{const items=favorites();items.unshift({id:Date.now(),name:new Date().toLocaleString()+' · '+state.config.tempo+' BPM',data:snapshot()});localStorage.setItem('guitarGrooveGreenFavorites',JSON.stringify(items));refreshFavorites();$('ggPhase').textContent='已收藏当前练习'}catch(e){$('ggPhase').textContent='收藏失败，请导出 JSON 备份'}};
 $('ggLoadFavorite').onclick=()=>{try{const item=favorites().find(x=>String(x.id)===$('ggFavorites').value);if(item){practice.history.push(snapshot());loadPractice(item.data)}}catch(e){$('ggPhase').textContent='无法载入收藏'}};refreshFavorites();
}
let scoreZoom=1.25,focusScroll=0;
function applyFocus(){
 const entering=practice.focus&&!document.body.classList.contains('score-focus');
 if(entering)focusScroll=window.scrollY;
 document.body.classList.toggle('score-focus',practice.focus);
 document.querySelector('.groove-layout').classList.toggle('practice-focus',practice.focus);
 $('ggFocus').textContent=practice.focus?'退出专注':'专注练习';$('ggFocus').setAttribute('aria-pressed',String(practice.focus));
 if(!$('ggScoreZoom')){
  $('ggFocus').insertAdjacentHTML('beforebegin','<span id="ggScoreZoom" class="score-zoom"><button class="btn" id="ggZoomOut" aria-label="缩小谱面">A−</button><output id="ggZoomValue" aria-label="谱面缩放比例"></output><button class="btn" id="ggZoomIn" aria-label="放大谱面">A＋</button></span>');
  $('ggZoomOut').onclick=()=>{scoreZoom=Math.max(1,Math.round((scoreZoom-.25)*100)/100);updateScoreZoom()};
  $('ggZoomIn').onclick=()=>{scoreZoom=Math.min(2,Math.round((scoreZoom+.25)*100)/100);updateScoreZoom()};
 }
 updateScoreZoom();
 if(entering)window.scrollTo(0,0);else if(!practice.focus)window.scrollTo(0,focusScroll);
}
function updateScoreZoom(){document.querySelector('.groove-layout').style.setProperty('--score-zoom',scoreZoom);$('ggZoomValue').textContent=Math.round(scoreZoom*100)+'%';$('ggZoomOut').disabled=scoreZoom<=1;$('ggZoomIn').disabled=scoreZoom>=2}
function favorites(){return JSON.parse(localStorage.getItem('guitarGrooveGreenFavorites')||'[]')}
function refreshFavorites(){try{const select=$('ggFavorites');select.replaceChildren(new Option('选择收藏',''));favorites().forEach(x=>select.add(new Option(x.name,String(x.id))))}catch(e){$('ggPhase').textContent='收藏存储不可用'}}
function snapshot(){return clone({config:state.config,result:state.result,practice:{count:practice.count,alternate:practice.alternate,a:practice.a,b:practice.b},mix:['Guitar','Drum','Click'].map(n=>({volume:$('gg'+n+'Volume').value,on:$('gg'+n+'Toggle').classList.contains('active')})),loop:state.loop,view:$('ggView').value,notation:$('ggNotation').value})}
function loadPractice(item){stop();state.config=clone(item.config);Object.assign(practice,item.practice||{});state.loop=item.loop??true;setup(clone(item.result));['Guitar','Drum','Click'].forEach((n,i)=>{if(!item.mix?.[i])return;$('gg'+n+'Volume').value=item.mix[i].volume;$('gg'+n+'Toggle').classList.toggle('active',item.mix[i].on);$('gg'+n+'Toggle').setAttribute('aria-pressed',String(item.mix[i].on))});$('ggView').value=item.view||'tab';$('ggNotation').value=item.notation||'fixed';$('ggSequenceOn').checked=state.config.practice==='sequence';applySequenceUI(false);updateMix();render();practice.last=snapshot()}
function applySequenceUI(regen=true){const on=$('ggSequenceOn')?.checked;if($('sequenceControls'))$('sequenceControls').hidden=!on;if($('ggMode'))$('ggMode').parentElement.hidden=!!on;document.querySelector('.sequence-section')?.classList.toggle('sequence-on',!!on);state.config.practice=on?'sequence':'normal';if(regen)regenerate(true)}
function changeTempo(delta){if(practice.ladder.active){$('ggPhase').textContent='速度阶梯进行中，请先停止阶梯';return}const running=state.playing||state.pending;stop();state.config.tempo=Math.max(40,Math.min(220,state.config.tempo+delta));$('ggTempo').value=state.config.tempo;render();practice.last=snapshot();if(running)play()}
function range(){const last=state.result.bars.length-1;practice.a=Math.min(practice.a,last);if(practice.b!==null)practice.b=Math.max(practice.a,Math.min(practice.b,last));return {a:practice.a,b:practice.b??last}}
function read(){const c=state.config;for(const [id,key] of [['ggKey','key'],['ggScale','scale'],['ggMeter','meter'],['ggTempo','tempo'],['ggMode','mode'],['ggStyle','style'],['ggDifficulty','difficulty'],['ggDensity','density'],['ggFeel','feel'],['ggDynamics','dynamics'],['ggSequenceLogic','sequenceLogic'],['ggPattern','pattern'],['ggDirection','direction'],['ggVariation','variation'],['ggTuning','tuning'],['ggPosition','position'],['ggMin','min'],['ggMax','max'],['ggVoicing','voicing'],['ggExtension','extension'],['ggGuitarSound','guitar'],['ggKit','kit'],['ggClickSound','click']]){const el=$(id);if(el)c[key]=['key','tempo','min','max','extension'].includes(key)?Number(el.value):el.value}if(c.min>c.max){[c.min,c.max]=[c.max,c.min];$('ggMin').value=c.min;$('ggMax').value=c.max;}}
function bind(){
 $('ggPrevNote').onclick=()=>stepNote(-1);$('ggNextNote').onclick=()=>stepNote(1);

 $('ggReload').onclick=()=>{stop();state.buffers.clear();prepareAudio(true).catch(e=>{$('ggSoundStatus').textContent='重载失败：'+e.message})};

 ['ggGuitarSound','ggKit','ggClickSound'].forEach(id=>$(id).onchange=async()=>{const running=state.playing;stop();read();await prepareAudio(false).catch(e=>{$('ggSoundStatus').textContent=e.message});if(running)play()});

function consonance(semitones){return [0,12].includes(semitones)?'极完全协和':[5,7].includes(semitones)?'完全协和':[3,4,8,9].includes(semitones)?'不完全协和':'不协和'}
function intervalPairs(semitones,degree){

const maxFretSpan=5;
const shapeColors=['#55b8ff','#ff9f6e','#65d6a6','#ffd166','#d99cff','#ff82b2','#79d8dc','#b6df6a'];
function practicalShapes(rootFret,semitones){
 const shapes=[];
 for(let root=6;root>=1;root--)for(let target=root;target>=1;target--){
  const fret=targetFret(root,target,rootFret,semitones);
  if(fret>=0&&fret<=12&&Math.abs(fret-rootFret)<=maxFretSpan)shapes.push({root,target,fret,span:Math.abs(fret-rootFret)});
 }
 return shapes;
}
function uniqueShapes(shapes,rootFret){
 const seen=new Set();
 return shapes.filter(shape=>{
  const key=(shape.root-shape.target)+':'+(shape.fret-rootFret);
  if(seen.has(key))return false;
  seen.add(key);
  return true;
 });
}
function staggerShapes(shapes,rootFret,semitones){
 const occupied=new Set(),placed=[];
 for(const shape of [...shapes].sort((a,b)=>b.span-a.span)){
  let choice;
  for(const limit of [12,18]){
   const candidates=Array.from({length:limit+1},(_,f)=>({rootFret:f,targetFret:targetFret(shape.root,shape.target,f,semitones)}))
    .filter(({targetFret:f})=>f>=0&&f<=limit)
    .sort((a,b)=>Math.abs(a.rootFret-rootFret)-Math.abs(b.rootFret-rootFret)||a.rootFret-b.rootFret);
   choice=candidates.find(({rootFret:r,targetFret:t})=>!occupied.has(shape.root+':'+r)&&!occupied.has(shape.target+':'+t));
   if(choice)break;
  }
  if(!choice)throw new Error('Cannot place interval shape on the board');
  occupied.add(shape.root+':'+choice.rootFret);
  occupied.add(shape.target+':'+choice.targetFret);
  placed.push({...shape,...choice});
 }

}
function combinedDiagram(shapes,label,semitones,rootFret){

 placed.forEach(({root,target,rootFret:r,targetFret:t},i)=>svg+='<path d="M '+x(r)+' '+y(root)+' L '+x(t)+' '+y(target)+'" class="ik-link" style="stroke:'+shapeColors[i%shapeColors.length]+'"/>');

  function replace(t){if(t.status!=='todo')return;const p=taskPlan(t),fresh=T.plan(p.prefs,Date.now(),p.day).tasks.find(x=>x.kind===t.kind);if(!fresh)return;const oldId=t.id;Object.assign(t,fresh,{id:oldId+'-r'+Date.now(),minutes:t.minutes});save();render();}
  function render(){
    const p=today();$('thSummary').textContent=p?p.tasks.filter(t=>t.status==='done').length+' / '+p.tasks.length+' 项完成':'尚未生成';
    $('thTasks').innerHTML=p?p.tasks.map(t=>`<article class="training-task"><header><h3>${esc(t.title)}</h3><span class="training-badge ${t.status==='done'?'done':''}">${statusNames[t.status]}</span></header><p>${esc(goals[t.kind])} · 预计 ${t.minutes} 分钟</p><p class="training-help">${E.names[t.params.key]} · ${C.scales[t.params.scale]} · ${t.params.tempo} BPM${t.kind==='connection'?' · II–V–I · '+t.params.min+'–'+t.params.max+' 品 · '+T.targets[t.params.target]:''}${t.kind==='ear'?' · '+t.params.count+' 音 · 四分 / 八分':''}${t.kind==='motif'?' · '+T.changes[t.params.variation]:''}</p><p>${t.progress} / ${t.goal} 次记录 · 已练 ${clock(t.id===activeId?timer.value():t.elapsed)}</p><div class="training-actions"><button class="btn primary" data-task-action="${t.status==='done'?'review':'start'}" data-task="${esc(t.id)}">${t.status==='done'?'再练一次':t.status==='doing'?'继续练习':'去完成 →'}</button>${t.status==='todo'?'<button class="btn" data-task-action="replace" data-task="'+esc(t.id)+'">换一个任务</button>':''}${!['done','skipped'].includes(t.status)?'<button class="btn" data-task-action="skip" data-task="'+esc(t.id)+'">跳过</button>':''}</div></article>`).join(''):'<p class="training-help">选好时间、重点和调式范围，建立一份可持续完成的计划。</p>';
    $('thHistory').innerHTML=data.plans.slice().reverse().slice(0,30).map(p=>`<details class="training-history"><summary>${esc(p.day)} · ${p.tasks.filter(t=>t.status==='done').length}/${p.tasks.length} 项 · ${clock(p.tasks.reduce((s,t)=>s+t.elapsed,0))}</summary>${p.tasks.map(t=>`<p>${esc(t.title)} · ${statusNames[t.status]} · ${t.progress}/${t.goal} · ${({good:'状态不错',review:'需要复习',difficult:'较困难'})[t.feedback]||'未评价'} <button class="btn" data-task-action="${t.status==='done'?'review':'start'}" data-task="${esc(t.id)}">${t.status==='done'?'复习':'继续'}</button></p>`).join('')}</details>`).join('')||'<p class="training-help">完成任务后在这里复盘。计时、次数和自评分别记录。</p>';renderDock();
  }
  function renderDock(){
    const t=task(),dock=$('trainingTaskDock');if(!dock)return;dock.hidden=!t;document.body.classList.toggle('training-task-open',!!t&&!collapsed);if(!t)return;
    dock.classList.toggle('collapsed',collapsed);const p=taskPlan(t);
    dock.innerHTML=`<div class="task-mini"><button class="btn task-dock-handle" data-dock="collapse" aria-expanded="${!collapsed}" aria-label="${collapsed?'固定展开任务面板':'收起任务面板'}">${collapsed?'‹':'›'}</button><span>${p.tasks.filter(x=>x.status==='done').length}/${p.tasks.length} 项 · <b id="thClock">${clock(timer.value())}</b></span><button class="btn" data-dock="pause">${timer.since===null?'继续':'暂停'}</button></div><div class="task-expanded"><h3>${esc(t.title)}</h3><p>${esc(goals[t.kind])}</p><p id="thTaskState">${deviated?'参数已偏离任务，请恢复指定内容或转为自由练习':timer.since===null?'计时暂停 · 返回后请手动继续':'正在计时 · 停止声音不会停止计时'}</p><progress max="${t.goal}" value="${t.progress}"></progress><p>${t.progress} / ${t.goal} 次 · 今日累计 <b id="thDayClock"></b></p><div class="training-actions"><button class="btn" data-dock="return">${deviated?'恢复指定任务':'回到任务'}</button>${['connection','rhythm'].includes(t.kind)?'<button class="btn" data-dock="step">记录一次实际练习</button>':''}<button class="btn" data-dock="free">转自由练习</button></div><label>本次自评<select id="thFeedback"><option value="good">状态不错</option><option value="review">需要复习</option><option value="difficult">较困难</option></select></label><div class="training-actions"><button class="btn primary" data-dock="complete" ${t.progress<t.goal||deviated?'disabled':''}>确认完成</button><button class="btn" data-dock="next">下一任务</button></div><p class="training-help">达到时长不自动完成。听感请逐题自评，动机请逐个尝试后记录。</p></div>`;renderClock();
  }
  function renderClock(){if($('thClock'))$('thClock').textContent=clock(timer.value());if($('thDayClock'))$('thDayClock').textContent=clock(data.plans.filter(p=>p.day===T.localDay()).flatMap(p=>p.tasks).reduce((s,t)=>s+(t.id===activeId?timer.value():t.elapsed),0));}
  function step(kind,token){const t=task();if(!t||t.kind!==kind||deviated||currentTool!==destinations[kind]||timer.since===null||t.progress>=t.goal)return false;if(token&&t.seen.includes(token))return false;if(token)t.seen.push(token);t.progress=Math.min(t.goal,t.progress+1);save();render();return true;}
  function complete(){const t=task();if(!t||t.progress<t.goal||deviated)return;const feedback=$('thFeedback').value;pause();t.status='done';t.feedback=feedback;root.TrainingStudio.stop();root.EarTraining.stop();root.GuitarGroove.stop();stopArpeggio();restoreFree(t.kind);activeId=null;save();render();showTool('daily');$('thStatus').textContent='已记录完成。可开始下一项，或在历史记录中复习。';}
  function next(){const t=task(),p=t?taskPlan(t):today();const nextTask=p?.tasks.find(x=>x.id!==activeId&&!['done','skipped'].includes(x.status));if(nextTask)start(nextTask);else {pause();showTool('daily');}}
  function navigate(tool){if(!loading&&task()&&tool!==destinations[task().kind])pause();currentTool=tool;$('todayPanel').hidden=tool!=='daily';root.TrainingStudio.navigate(tool);if(tool==='daily')render();}
  function deviate(kind){if(loading||!task()||task().kind!==kind)return;deviated=true;pause();renderDock();}
  function exerciseChanged(kind,snapshot){const t=task();if(loading||!t||t.kind!==kind||deviated)return;if(kind==='motif'&&JSON.stringify(t.snapshot.a)===JSON.stringify(snapshot.a)&&snapshot.type===t.params.variation){t.snapshot=clone(snapshot);save();}else if(kind==='connection')deviate(kind);else if(kind==='motif')deviate(kind);}
  function earChanged(snapshot){const t=task();if(loading||!t||t.kind!=='ear'||deviated)return;const p=t.params,q=snapshot.question;if(q.scale!==p.scale||q.key!==p.key||q.count!==p.count||snapshot.settings.tempo!==p.tempo){deviate('ear');return;}t.snapshot=clone(snapshot);save();}
  function rateEar(record){const index=data.reviews.findIndex(x=>x.question.seed===record.question.seed&&x.question.scale===record.question.scale&&x.question.key===record.question.key);if(index>=0)data.reviews[index]=clone(record);else data.reviews.push(clone(record));if(data.reviews.length>500)data.reviews.shift();earChanged(record);step('ear',String(record.question.seed));save();}
  function reviewEar(){const candidates=data.reviews.filter(r=>r.rating!=='independent');if(!candidates.length){$('etRatingStatus').textContent='还没有困难题。先完成一题并自评。';return;}const current=root.EarTraining.snapshot()?.question?.seed;const item=candidates.find(r=>r.question.seed!==current)||candidates[0];deviate('ear');root.EarTraining.load({...clone(item),hints:[],revealedNotes:[],rated:false,answerVisible:false});$('etRatingStatus').textContent='已载入原始困难题 · 重新听辨并自评';}
  function saveMotif(m){data.favorites.unshift(clone(m));data.favorites=data.favorites.slice(0,100);save();root.TrainingStudio.refreshFavorites(data.favorites);$('tmStatus').textContent='已收藏 A / B。随练习备份一起导出。';}
  function loadMotif(index){if(index===''||!data.favorites[+index])return;deviate('motif');root.TrainingStudio.load('motif',data.favorites[+index]);}
  function exportBackup(){pause();const raw=storageBlocked?localStorage.getItem(KEY):JSON.stringify(data,null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='一起练琴吧-练习备份-'+T.localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('thStatus').textContent=storageBlocked?'已导出受保护的原始记录，请保留以便恢复。':'已导出计划、计时、听感复习与动机收藏。';}
  async function importBackup(){const file=$('thImportFile').files[0];if(!file)return;try{if(file.size>5000000)throw Error('备份不能超过 5 MB。');const imported=T.validateBackup(JSON.parse(await file.text()));if(!confirm('导入会替换当前计划、计时与复习记录，建议先导出。是否继续？'))return;pause();root.TrainingStudio.stop();root.EarTraining.stop();root.GuitarGroove.stop();data=imported;storageBlocked=false;activeId=null;timer.load();freeSnapshots.clear();save();root.TrainingStudio.refreshFavorites(data.favorites);render();$('thStatus').textContent='备份已导入，计时保持暂停。';}catch(e){$('thStatus').textContent='导入失败：'+e.message;}finally{$('thImportFile').value='';}}
  root.TrainingHub={init,navigate,deviate,exerciseChanged,earChanged,rateEar,reviewEar,saveMotif,loadMotif,step,get activeKind(){return !deviated&&task()?.kind;}};
})(globalThis);

</script><script>TrainingStudio.init();TrainingHub.init();</script><script>
/* Presentation only: retain native range inputs and their existing audio handlers. */
(() => {
  const navigationLabels = {
    navToday: '练习',
    navChord: '琶音',
    navRhythm: '律动',
    navEar: '听感',
    navKnowledge: '指板',
    navChordShapes: '和弦'
  };
  Object.entries(navigationLabels).forEach(([id, shortLabel]) => {
    const button = document.getElementById(id);
    if (!button) return;
    const label = button.textContent.trim();
    button.dataset.shortLabel = shortLabel;
    button.title = label;
    button.setAttribute('aria-label', label);
  });
  const volumes = new Set(['ggGuitarVolume', 'ggDrumVolume', 'ggClickVolume']);
  function paint(input) {
    const min = Number(input.min || 0), max = Number(input.max || 100);
    const percentage = Math.max(0, Math.min(100, (Number(input.value) - min) / (max - min || 1) * 100));
    input.style.setProperty('--studio-fill', `${percentage}%`);
    if (volumes.has(input.id)) {
      let output = document.getElementById(`${input.id}Readout`);
      if (!output) {
        output = document.createElement('output');
        output.id = `${input.id}Readout`;
        output.htmlFor = input.id;
        output.className = 'studio-volume-value';
        input.before(output);
      }
      output.value = `${input.value}%`;
    }
  }
  function refresh() { document.querySelectorAll('input[type=range]').forEach(paint); }
  document.addEventListener('input', event => {
    if (event.target.matches('input[type=range]')) paint(event.target);
  });
  // Restore/daily practice can recreate controls and set values programmatically.
  let queued = false;
  const observer = new MutationObserver(records => {
    if (queued || !records.some(record => Array.from(record.addedNodes).some(node =>
      node.nodeType === 1 && (node.matches('input[type=range]') || node.querySelector('input[type=range]'))))) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; refresh(); });
  });
  observer.observe(document.body, { childList: true, subtree: true });
  document.addEventListener('click', () => requestAnimationFrame(refresh));
  document.addEventListener('change', () => requestAnimationFrame(refresh));
  refresh();
})();

</script></body></html>
