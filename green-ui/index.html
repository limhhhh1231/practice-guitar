<div class="app"><aside class="sidebar"><div class="platform-brand"><div class="mark" aria-hidden="true"><svg class="guitar-logo" viewBox="0 0 40 40" focusable="false" aria-hidden="true"><path fill-rule="evenodd" d="M17 3h6v6h-1v6c4-2 7 1 6 4-.8 2-2 3 0 5 3 3 3 6 1 9-3 4-15 4-18 0-2-3-2-6 1-9 2-2 .8-3 0-5-1-3 2-6 6-4V9h-1V3Zm6 21a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path d="M17 31h6M20 10v10" fill="none" stroke="#45d577" stroke-width="1.3" stroke-linecap="round"/></svg></div><span class="platform-name">一起练琴吧</span></div><div><div class="menu-label">练习工具</div><nav class="tool-nav" aria-label="练习工具导航"><button class="active" id="navChord" type="button">和弦琶音练习</button><button id="navRhythm" type="button">吉他律动生成器</button></nav></div><div class="sidebar-note">把每天的练习拆成一个小节，先听，再弹，慢慢建立稳定律动。</div></aside><main><div class="topbar"><div class="title-area"><div class="title-lockup"><div class="mark" role="img" aria-label="吉他图标"><svg class="guitar-logo" viewBox="0 0 40 40" focusable="false" aria-hidden="true"><path fill-rule="evenodd" d="M17 3h6v6h-1v6c4-2 7 1 6 4-.8 2-2 3 0 5 3 3 3 6 1 9-3 4-15 4-18 0-2-3-2-6 1-9 2-2 .8-3 0-5-1-3 2-6 6-4V9h-1V3Zm6 21a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path d="M17 31h6M20 10v10" fill="none" stroke="#45d577" stroke-width="1.3" stroke-linecap="round"/></svg></div><div class="title-copy"><div class="title-line"><h1 id="pageTitle">和弦琶音练习工具</h1></div></div></div><p id="pageSubtitle">探索调内七和弦，在指板上锁定你的下一个把位。</p></div><div class="status credit" aria-label="作者注释">LIM 制作</div></div>

<div class="grid"><section class="card"><div class="card-head"><h2 id="boardTitle">C Ionian · 0 — 12 品</h2><span class="small">E A D G B E</span></div><div class="fret-wrap"><div class="fretboard"><div class="frets" id="frets"></div><div class="open-label">0</div><div class="strings" id="strings"></div><div class="nut"></div><div class="open-notes" id="openNotes"></div><div class="notes" id="notes"></div></div></div><div class="legend"><span><b></b><span id="rootLegend">调式根音</span></span><span><b class="s"></b>调式音</span><span><b class="c"></b>和弦音</span><span class="small" style="margin-left:auto">0 品为空弦；点击和弦查看琶音指型</span></div></section>

<script>
const chrom=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'], fixedDegreeLabels=['1','♯1','2','♭3','3','4','♯4','5','♭6','6','♭7','7'], tuning=[4,11,7,2,9,4];
const modes=Object.fromEntries(Object.entries(GrooveEngine.scales).map(([id,interval])=>[id,{name:PracticeCatalog.scales[id],interval}]));
let state={root:0,mode:'major',display:'scale',notation:'movable',start:0,end:12,only:true,chord:-1};
const $=id=>document.getElementById(id);function noteName(n){return chrom[(n+12)%12]}
function degreeLabel(interval,index){return PracticeCatalog.degree(state.mode,interval);}
const thirdNames={2:'减三',3:'小三',4:'大三',5:'增三'};function chordIntervalPattern(pitches){return pitches.slice(0,-1).map((pitch,i)=>{const semitones=(pitches[i+1]-pitch+12)%12;return thirdNames[semitones]||`${semitones} 半音`}).join(' - ')}
function chordDegreeLabel(pitch,root){const semitones=(pitch-root+12)%12;return ({0:'1',3:'♭3',4:'3',6:'♭5',7:'5',8:'♭6',9:'6',10:'♭7',11:'7'})[semitones]||String(semitones)}function notationLabel(pitch,modeIntervals,degree,chordRoot,inChord){if(state.notation==='fixed')return fixedDegreeLabels[(pitch+12)%12];if(state.chord>=0&&chordRoot!==undefined&&inChord)return chordDegreeLabel(pitch,chordRoot);return degreeLabel(modeIntervals[degree],degree)}
function currentHarmony(degree=state.chord){return PracticeCatalog.chord(state.mode,state.root,Math.max(0,degree));}
function render(){
 const m=modes[state.mode],scale=m.interval.map(x=>(state.root+x)%12),h=state.chord>=0?currentHarmony():null,rootPitch=h?h.root:state.root,chordPitches=h?h.pcs:[];
 $('display').value=state.display;$('notation').value=state.notation;$('start').value=state.start;$('end').value=state.end;$('switch').classList.toggle('on',state.only);
 $('boardTitle').textContent=noteName(state.root)+' '+m.name+' · '+state.start+' — '+state.end+' 品';
 $('rootLegend').textContent=h?'和弦根音':'调式根音';$('rangeText').textContent=state.start+' — '+state.end+' 品';$('startVal').textContent=state.start;$('endVal').textContent=state.end;
 const parent=PracticeCatalog.parentScale(state.mode);
 $('chordCount').textContent=parent===state.mode?'7 chords':'母调七和弦 · '+PracticeCatalog.scales[parent];
 $('chordCount').title=parent===state.mode?'调式内三度堆叠':'与律动生成器一致：五声 / Blues 使用对应母调七和弦，部分和弦音不在所选音阶内';
 $('frets').innerHTML=Array.from({length:12},(_,i)=>'<div class="fret"><span>'+(i+1)+'</span></div>').join('');
 $('strings').innerHTML=Array.from({length:6},(_,i)=>'<div class="string" style="--thick:'+(1+i*.35)+'px"></div>').join('');
 let html='',openHtml='';
 for(let s=0;s<6;s++)for(let f=0;f<=12;f++){
  const p=(tuning[s]+f)%12,degree=scale.indexOf(p),inScale=degree>=0,inChord=chordPitches.includes(p),visible=!state.only||f>=state.start&&f<=state.end;
  if(f>0&&(!visible||!(inChord||inScale)))continue;
  const label=inChord||inScale?notationLabel(p,m.interval,degree,rootPitch,inChord):'—';
  let cls=inScale?'note scale':'note open-muted';
  if(h&&inChord)cls='note chord'+(p===rootPitch?' root':'');else if(!h&&p===rootPitch)cls='note root';
  const marker='<div class="'+cls+'" style="'+(f?'grid-column:'+f+';':'')+'grid-row:'+(s+1)+'" title="'+noteName(p)+(f?' · 简谱 '+label:' · 空弦 · '+label)+'">'+noteName(p)+'<small>'+label+'</small></div>';
  if(f)html+=marker;else openHtml+=marker;
 }
 $('notes').innerHTML=html;$('openNotes').innerHTML=openHtml;
 $('chords').innerHTML=Array.from({length:7},(_,i)=>{
  const chord=currentHarmony(i),tones=chord.pcs,parts=chordIntervalPattern(tones).split(' - ');
  return '<div class="chord '+(i===state.chord?'selected':'')+'" data-i="'+i+'"><div class="chord-head"><div class="chord-heading"><span class="roman">'+['I','II','III','IV','V','VI','VII'][i]+'</span><span class="name">'+chord.name+'</span></div><span class="badge">'+(i===0?'主和弦':'七和弦')+'</span></div><div class="chord-note-row" aria-label="和弦音名">'+tones.map((p,n)=>'<span class="'+(!n?'root-tone':'')+'">'+noteName(p)+'</span>').join('')+'</div><div class="chord-degree-row" aria-label="简谱音级">'+tones.map((p,n)=>'<span class="'+(!n?'root-tone':'')+'">'+(state.notation==='fixed'?fixedDegreeLabels[p]:chordDegreeLabel(p,chord.root))+'</span>').join('')+'</div><div class="chord-interval-row">'+parts.map(p=>'<span>'+p+'</span>').join('')+'</div></div>';
 }).join('');
 document.querySelectorAll('.chords .chord').forEach(c=>c.onclick=()=>{state.chord=+c.dataset.i;state.display='chord';render();});
 if($('motifModal').classList.contains('open'))renderMotif();
}
$('mode').innerHTML=Object.entries(PracticeCatalog.scales).map(([id,name])=>'<option value="'+id+'">'+name+'</option>').join('');
$('mode').value='major';
['root','mode','display','notation'].forEach(id=>$(id).onchange=e=>{state[id]=id==='root'?chrom.indexOf(e.target.value):e.target.value;if(id==='display'){if(state.display==='scale')state.chord=-1;else if(state.chord<0)state.chord=0}else if(id!=='notation'){state.chord=-1;if(state.display==='chord')state.chord=0}render()});['start','end'].forEach(id=>$(id).oninput=e=>{state[id]=+e.target.value;if(state.start>state.end){if(id==='start')state.end=state.start;else state.start=state.end}render()});$('switch').onclick=()=>{state.only=!state.only;$('switch').classList.toggle('on',state.only);render()};$('reset').onclick=()=>{state={root:0,mode:'major',display:'scale',notation:'movable',start:0,end:12,only:true,chord:-1};$('root').value='C';$('mode').value='major';$('display').value='scale';$('notation').value='movable';$('start').value=0;$('end').value=12;$('switch').classList.add('on');render()};
const motifPatterns=[{steps:[0,1,2,3,2,1,3,0],hint:'上行经过三度后回落，注意每拍的落点。'},{steps:[0,2,1,3,2,0,1,0],hint:'跳进与级进交替，保持八拍的律动均匀。'},{steps:[3,2,1,0,1,2,3,2],hint:'从七音开始倒行，最后回到五音形成悬念。'},{steps:[0,1,0,2,1,3,2,0],hint:'把第一拍的短句移位重复，感受动机发展。'},{steps:[0,3,2,1,3,1,2,0],hint:'根音与七音形成大跳，唱准后再加快速度。'}];let motifIndex=-1,lastMotifPitches=[];
function motifInfo(){const m=modes[state.mode],scale=m.interval.map(x=>(state.root+x)%12),degree=state.chord>=0?state.chord:0,h=currentHarmony(degree);return {m,scale,degree,pitches:h.pcs,root:h.root,type:h.name.slice(GrooveEngine.names[h.root].length),fallback:state.chord<0};}
function motifLabel(pitch,root){return state.notation==='fixed'?fixedDegreeLabels[(pitch+12)%12]:chordDegreeLabel(pitch,root)}
let motifReturnFocus=null;function renderMotif(){const info=motifInfo(),wasOpen=$('motifModal').classList.contains('open');if(motifIndex<0)motifIndex=Math.floor(Math.random()*motifPatterns.length);const pattern=motifPatterns[motifIndex%motifPatterns.length];lastMotifPitches=pattern.steps.map(i=>info.pitches[i]);$('motifTitle').textContent=`${noteName(info.root)}${info.type} · 动机训练`;$('motifContext').textContent=info.fallback?`当前未选和弦，先用 ${noteName(info.root)}${info.type}（I 级）生成`:`仅使用 ${noteName(info.root)}${info.type} 的和弦内音`;$('motifTones').innerHTML=info.pitches.map((p,i)=>`<span class="motif-tone${i===0?' root-tone':''}"><b>${noteName(p)}</b><small>${motifLabel(p,info.root)}</small></span>`).join('');$('motifSequence').innerHTML=lastMotifPitches.map((p,i)=>`<span class="motif-step${p===info.root?' root-step':''}"><span class="beat">${i+1}</span><b>${motifLabel(p,info.root)}</b><small>${noteName(p)}</small></span>`).join('');$('motifHint').textContent=pattern.hint;$('motifModal').classList.add('open');$('motifModal').setAttribute('aria-hidden','false');if(!wasOpen)setTimeout(()=>$('motifClose').focus(),0);}
function closeMotif(){globalThis.TrainingStudio?.stop();if(typeof stopMotifAudio==='function')stopMotifAudio();$('motifModal').classList.remove('open');$('motifModal').setAttribute('aria-hidden','true');if(motifReturnFocus&&motifReturnFocus.focus)motifReturnFocus.focus();motifReturnFocus=null}
$('motifBtn').onclick=()=>{motifReturnFocus=$('motifBtn');if(state.chord<0){state.chord=0;state.display='chord';render()}renderMotif();globalThis.TrainingStudio?.resetMotifView()};$('regenerateMotif').onclick=()=>{motifIndex=(motifIndex+1)%motifPatterns.length;renderMotif()};$('motifClose').onclick=closeMotif;$('motifModal').onclick=e=>{if(e.target===$('motifModal'))closeMotif()};document.addEventListener('keydown',e=>{if(!$('motifModal').classList.contains('open'))return;if(e.code==='Space'&&!e.repeat&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName)&&document.querySelector('.motif-modal').classList.contains('developing')){e.preventDefault();TrainingStudio.toggleMotif();return}if(e.key==='Escape'){closeMotif();return}if(e.key==='Tab'){const focusables=[...document.querySelectorAll('#motifModal button,#motifModal select,#motifModal input,[tabindex="0"]')].filter(el=>el.getClientRects().length&&!el.disabled),first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('playMotif').onclick=()=>{if(typeof playMotifSequence==='function')playMotifSequence(lastMotifPitches)};
/* Dry steel-string samples shared by arpeggio and motif practice. */
let audioCtx=null, playing=false, playTimer=[], audioBus=null, playGeneration=0;
function makeAudioBus(ctx){const input=ctx.createGain();input.gain.value=.6*Number($('practiceVolume').value)/100;input.connect(ctx.destination);return {input};}
$('practiceVolume').oninput=()=>{const volume=Number($('practiceVolume').value);$('practiceVolumeValue').textContent=volume+'%';if(audioBus&&audioCtx&&audioCtx.state!=='closed')audioBus.input.gain.setTargetAtTime(.6*volume/100,audioCtx.currentTime,.015);};
function pluckGuitarString(ctx,destination,frequency,when,velocity=.78,duration=1.65){
  const midi=69+12*Math.log2(frequency/440),root=Object.keys(practiceSamples).map(Number).sort((a,b)=>Math.abs(a-midi)-Math.abs(b-midi))[0];
  const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=practiceSamples[root];source.playbackRate.value=2**((midi-root)/12);
  const end=when+Math.min(duration,source.buffer.duration/source.playbackRate.value);
  gain.gain.setValueAtTime(0,when);gain.gain.linearRampToValueAtTime(velocity,when+.003);gain.gain.setValueAtTime(velocity,Math.max(when+.004,end-.03));gain.gain.linearRampToValueAtTime(0,end);
  source.connect(gain).connect(destination);source.start(when);source.stop(end+.002);source.onended=()=>{source.disconnect();gain.disconnect()};
}
let practiceSamples=null,practiceSamplesLoading=null;
function loadPracticeSamples(ctx){
  if(practiceSamples)return Promise.resolve();
  if(!practiceSamplesLoading)practiceSamplesLoading=Promise.all(Object.entries(GuitarSampleBank.guitars.steel).map(async([root,data])=>{const bytes=Uint8Array.from(atob(data.split(',')[1]),c=>c.charCodeAt(0));return [root,await ctx.decodeAudioData(bytes.buffer)];})).then(entries=>{practiceSamples=Object.fromEntries(entries)}).finally(()=>{practiceSamplesLoading=null});
  return practiceSamplesLoading;
}
function stopArpeggio(){playGeneration++;playTimer.forEach(clearTimeout);playTimer=[];if(audioCtx){try{audioCtx.close()}catch(e){}}audioCtx=null;audioBus=null;playing=false;const button=$('play');if(button)button.textContent='▶ 播放琶音';}
function playGuitarSequence(pitches,{spacing=.31,duration=1.65,velocity=.78}={}){
 globalThis.TrainingStudio?.stop();globalThis.EarTraining?.stop();globalThis.GuitarGroove?.stop();
  const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor||!Array.isArray(pitches)||!pitches.length)return;
  if(playing)stopArpeggio();
  try{audioCtx=new AudioCtor();audioBus=makeAudioBus(audioCtx)}catch(e){audioCtx=null;audioBus=null;return}
  playing=true;const generation=++playGeneration;$('play').textContent='■ 停止播放';
  const m=modes[state.mode],scale=m.interval.map(x=>(state.root+x)%12),root=state.chord>=0?currentHarmony().root:state.root,intervals=pitches.map(p=>(p-root+12)%12);
  const schedule=()=>{if(!audioCtx||generation!==playGeneration)return;const now=audioCtx.currentTime;
    pitches.forEach((p,i)=>{const semitones=intervals[i],midi=48+root+semitones,freq=440*Math.pow(2,(midi-69)/12);pluckGuitarString(audioCtx,audioBus.input,freq,now+i*spacing,velocity,duration);});
    playTimer.push(setTimeout(()=>{if(generation===playGeneration)stopArpeggio()},Math.ceil((pitches.length-1)*spacing*1000+duration*1000+380)));
  };
  const ctx=audioCtx;
  Promise.all([ctx.resume(),loadPracticeSamples(ctx)]).then(schedule).catch(()=>{if(generation===playGeneration){stopArpeggio();$('playMotif').textContent='音色载入失败，点击重试';}});
}
function playArpeggio(){if(playing){stopArpeggio();return}const m=modes[state.mode],scale=m.interval.map(x=>(state.root+x)%12),root=state.chord>=0?currentHarmony().root:state.root,tones=state.chord>=0?currentHarmony().pcs:scale;playGuitarSequence(tones,{spacing:.31,duration:1.65,velocity:.78});}
/* Motifs retain their timing and use the same unprocessed guitar recordings. */
function playMotifSequence(pitches){$('playMotif').textContent='▶ 播放动机';if(playing)stopArpeggio();playGuitarSequence(pitches,{spacing:.3,duration:1.15,velocity:.7});}
function stopMotifAudio(){if(playing)stopArpeggio();}
$('play').onclick=playArpeggio;
function showTool(tool){
 stopArpeggio();GuitarGroove.stop();globalThis.EarTraining?.stop();
 if(document.body.classList.contains('score-focus'))$('ggFocus').click();
 const rhythm=tool==='rhythm',knowledge=tool==='knowledge',chordShapes=tool==='chordShapes',ear=tool==='ear',daily=tool==='daily';
 $('rhythmPanel').classList.toggle('active',rhythm);$('knowledgePanel').hidden=!knowledge;$('chordShapesPanel').hidden=!chordShapes;if($('earPanel'))$('earPanel').hidden=!ear;
 document.querySelector('.controls').style.display=rhythm||knowledge||chordShapes||ear||daily?'none':'';
 document.querySelector('.grid').style.display=rhythm||knowledge||chordShapes||ear||daily?'none':'';
 for(const [id,active]of [['navChord',tool==='chord'],['navRhythm',rhythm],['navKnowledge',knowledge],['navChordShapes',chordShapes],['navEar',ear],['navToday',daily]])$(id)?.classList.toggle('active',active);
 $('pageTitle').textContent=daily?'今日练习':ear?'听感练习':chordShapes?'常用和弦指型':knowledge?'指板知识':rhythm?'吉他律动生成器':'和弦琶音练习工具';
 globalThis.TrainingHub?.navigate(tool);
}
$('navChord').onclick=()=>showTool('chord');$('navRhythm').onclick=()=>showTool('rhythm');
document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat)return;const tag=document.activeElement?.tagName;if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(tag)||document.activeElement?.isContentEditable)return;if(document.querySelector('.modal-backdrop.open'))return;if(document.getElementById('todayPanel')&&!document.getElementById('todayPanel').hidden)return;e.preventDefault();if(document.getElementById('earPanel')&&!document.getElementById('earPanel').hidden){EarTraining.togglePlay()}else if(globalThis.TrainingHub?.activeKind==='connection'){document.getElementById('tcPlay').click()}else if(globalThis.TrainingHub?.activeKind==='motif'){TrainingStudio.toggleMotif()}else if(document.getElementById('rhythmPanel').classList.contains('active')){GuitarGroove.togglePlay()}else if(document.getElementById('knowledgePanel').hidden&&document.getElementById('chordShapesPanel').hidden){playArpeggio()}});
const sidebarToggle=()=>{const app=document.querySelector('.app'),collapsed=app.classList.toggle('sidebar-collapsed');document.querySelector('.platform-brand').setAttribute('aria-expanded',String(!collapsed));};document.querySelector('.platform-brand').onclick=e=>{if(e.target.closest('.tool-nav'))return;sidebarToggle()};
